name: Bug report
description: Report a reproducible problem with Smart Auto Move NG
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Smart Auto Move NG. Please complete the details below so the problem can be investigated.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the open and closed issues and did not find a duplicate.
          required: true
        - label: I reproduced the problem with all other extensions disabled.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: What happened, and what were you doing when it happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: input
    id: extension-version
    attributes:
      label: Extension version
      placeholder: "For example: 50.16"
    validations:
      required: true

  - type: input
    id: gnome-version
    attributes:
      label: GNOME Shell version
      description: Run `gnome-shell --version`.
      placeholder: "For example: GNOME Shell 50.0"
    validations:
      required: true

  - type: input
    id: distribution
    attributes:
      label: Linux distribution
      placeholder: "For example: Fedora 44 or Ubuntu 26.04"
    validations:
      required: true

  - type: dropdown
    id: session-type
    attributes:
      label: Session type
      description: Run `echo $XDG_SESSION_TYPE` if you are unsure.
      options:
        - Wayland
        - X11
        - Other
    validations:
      required: true

  - type: dropdown
    id: installation-source
    attributes:
      label: Installation source
      options:
        - extensions.gnome.org
        - GitHub release
        - Source checkout
        - Distribution package
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Reproduce the problem, then paste relevant GNOME Shell journal messages. Redact any sensitive information.
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots, recordings, or any other useful details.
